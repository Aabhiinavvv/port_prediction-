name: Public Data Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'data_pipeline/**'
      - 'requirements.txt'

jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Download public inputs
        run: python data_pipeline/public_data_ingestion.py --start 2019-01-01 --end 2025-12-31
      - name: Build public feature table
        run: python data_pipeline/public_market_adapter.py --start 2019-01-01 --end 2025-12-31
      - name: Run ablation validation
        run: python data_pipeline/ablation_validation.py
      - name: Show validation metrics
        run: cat data/public_processed/ablation_metrics.csv
      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-data-validation
          path: data/public_processed/ablation_*.csv
